[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "owlrl-turbo"
version = "0.1.0a2"
description = "Native RDFS and OWL-RL inference using the rdflib-turbo runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "DataRoad Inc, Delaware, USA, trading as Legra" }]
dependencies = ["rdflib-turbo==0.1.0a2"]

[project.urls]
Repository = "https://github.com/legra-ai/owlrl-turbo"
Issues = "https://github.com/legra-ai/owlrl-turbo/issues"

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-cov>=7.1,<8", "owlrl>=7.1,<8", "pyshacl-turbo>=0.2.4,<0.3", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/owlrl_turbo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF"]

[tool.coverage.run]
source = ["owlrl_turbo"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true

[dependency-groups]
dev = ["mypy>=1.15,<3"]
