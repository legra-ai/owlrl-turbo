name: Tests and wheels
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested alpha to PyPI
        type: boolean
        default: false
  schedule:
    - cron: '31 4 * * *'
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    shell: bash {0}
jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - id: release
        run: uv run --no-project python scripts/prepare_release.py
  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
      - name: Build wheel from the source archive
        run: |
          uv build --sdist --out-dir source-dist || exit 1
          uv build --wheel --out-dir wheel-dist source-dist/*.tar.gz || exit 1
          mkdir dist || exit 1
          cp source-dist/* wheel-dist/* dist/ || exit 1
      - run: uv --project tools/packaging run --locked --only-group packaging twine check --strict dist/*
      - run: uv run --no-project python scripts/release_packages.py check-build
      - uses: actions/checkout@v7
        with:
          repository: legra-ai/rdflib-turbo
          ref: d2692efc768554473a65eece7d0fce6836b47f57
          path: rdflib-turbo
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.16'
      - name: Prepare the provider's original facade and YAML cohort
        working-directory: rdflib-turbo
        run: uv run --no-project --python 3.13.16 python -B scripts/ci_facade.py prepare --output "$RUNNER_TEMP/candidate-facade-evidence"
      - uses: actions/upload-artifact@v7
        with:
          name: provider-facade-cohort
          path: ${{ runner.temp }}/candidate-facade-evidence
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: dist/*
          if-no-files-found: error
  native-coverage:
    needs: prepare
    uses: ./.github/workflows/native-coverage.yml
    with:
      revision: ${{ needs.prepare.outputs.revision }}

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
      - run: uv run --locked --extra test ruff check src tests scripts
      - run: uv run --locked --extra test ruff format --check src tests scripts
  wheels:
    needs: [prepare, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/checkout@v7
        with:
          repository: legra-ai/rdflib-turbo
          ref: d2692efc768554473a65eece7d0fce6836b47f57
          path: rdflib-turbo
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.99.1
          cache-key: owl-provider-${{ hashFiles('rdflib-turbo/vendor/**') }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: provider-facade-cohort
          path: ${{ runner.temp }}/candidate-facade-evidence
      - name: Verify the cohort and arrange its exact declaration
        working-directory: rdflib-turbo
        run: uv run --no-project --python 3.13.16 python -B scripts/ci_facade.py consume --input "$RUNNER_TEMP/candidate-facade-evidence" --environment-file "$GITHUB_ENV"
      - run: uv run --no-project --python 3.13.16 python -B scripts/test_wheel.py
        env:
          OWLRL_TEST_RUNTIME_SOURCE: ${{ github.workspace }}/rdflib-turbo
          CARGO_TARGET_DIR: ${{ github.workspace }}/provider-target
  minimum-runtime:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: dist
      - run: uv run --locked --extra test python scripts/test_minimum_runtime.py

  test:
    name: test
    needs: [prepare, verify, build, wheels, native-coverage, minimum-runtime]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
      - name: Require all release checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: uv run --no-project python {0}
        run: |
          import json, os
          failures = [name for name, job in json.loads(os.environ['RESULTS']).items() if job['result'] != 'success']
          if failures:
              raise SystemExit(f'Required release checks failed: {failures}')

  publish:
    needs: [prepare, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/owlrl-turbo/
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
    steps:
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: uv run --no-project python scripts/tag_release.py
      - name: Create draft prerelease if absent
        run: |
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            printf 'Restoring existing release artifacts\n'
          else
            gh release create "v$RELEASE_VERSION" --verify-tag --title "v$RELEASE_VERSION" --notes-file docs/release-notes.md --draft --prerelease || exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - run: uv run --no-project python scripts/release_packages.py stage
      - id: pending
        run: uv run --no-project python scripts/release_packages.py filter
      - name: Attest the original tested archives
        if: steps.pending.outputs.missing == 'true'
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a
        with:
          paths: pending-packages/*
      - if: steps.pending.outputs.missing == 'true'
        run: uv publish --trusted-publishing always pending-packages/*
      - run: uv run --no-project python scripts/release_packages.py verify
      - run: gh release edit "v$RELEASE_VERSION" --draft=false

  publish-coverage:
    name: Publish measured coverage
    needs: [prepare, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: native-rust-coverage
          path: coverage-site/reports
      - run: uv run --no-project python scripts/coverage_site.py --python coverage-site/reports/owlrl-python-coverage.json --rust coverage-site/reports/summary.json --output coverage-site --project owlrl-turbo --revision "${{ needs.prepare.outputs.revision }}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: coverage-site
      - uses: actions/deploy-pages@v5
        id: deployment
