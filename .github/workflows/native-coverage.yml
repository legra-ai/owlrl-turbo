name: Shared native Rust coverage
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash {0}
    working-directory: coverage-runtime
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          path: coverage-companion-owlrl
      - uses: actions/checkout@v7
        with:
          repository: legra-ai/rdflib-turbo
          ref: 2e7b4048a792f496b86cbc9ecde00d921d9d03f4
          path: coverage-runtime
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.16'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview
          cache: false
      - name: Prepare the provider's original facade and YAML cohort
        run: uv run --no-project --python 3.13.16 python -B scripts/ci_facade.py prepare --output "$RUNNER_TEMP/candidate-facade-evidence"
      - name: Verify the cohort and arrange its exact declaration
        run: uv run --no-project --python 3.13.16 python -B scripts/ci_facade.py consume --input "$RUNNER_TEMP/candidate-facade-evidence" --environment-file "$GITHUB_ENV"
      - name: Build this OWL companion from its original source archive
        working-directory: coverage-companion-owlrl
        run: |
          uv build --sdist --out-dir ../coverage-runtime/native-coverage/companion-originals/source || exit 1
          uv build --wheel --out-dir ../coverage-runtime/native-coverage/companion-originals/wheel ../coverage-runtime/native-coverage/companion-originals/source/*.tar.gz || exit 1
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - run: uv run --no-project --python 3.13.16 python -B scripts/native_coverage.py --python 3.13.16 --shacl-source "$SHACL_SOURCE" --shacl-wheel "$SHACL_WHEEL" --shacl-candidate-receipt "$SHACL_CANDIDATE_RECEIPT" --shacl-base-revision "$SHACL_BASE_REVISION" --yaml-authority "$YAML_AUTHORITY" --owlrl-source ../coverage-companion-owlrl --owlrl-wheel native-coverage/companion-originals/wheel/owlrl_turbo-*.whl
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-rust-coverage
          path: coverage-runtime/native-coverage/
          if-no-files-found: error
