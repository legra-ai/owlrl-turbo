name: Shared native Rust coverage
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash {0}
    working-directory: coverage-runtime
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          path: coverage-companion-owlrl
      - uses: actions/checkout@v7
        with:
          repository: legra-ai/rdflib-turbo
          ref: e77b6359b2ba6d7694b741eb7f87f60b58faa1ca
          path: coverage-runtime
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview
          cache: false
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - run: uv run --no-project python scripts/native_coverage.py --owlrl-source ../coverage-companion-owlrl
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-rust-coverage
          path: coverage-runtime/native-coverage/
          if-no-files-found: error
